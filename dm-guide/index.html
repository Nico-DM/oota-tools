<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="dark" />
        <title>Out of the Abyss — Guía del DM</title>
        <link rel="stylesheet" href="styles.css" />
        <script src="capitulos/capitulo-01.js" defer></script>
        <script src="capitulos/capitulo-02.js" defer></script>
        <script src="capitulos/capitulo-03.js" defer></script>
        <script src="capitulos/capitulo-04.js" defer></script>
        <script src="capitulos/capitulo-05.js" defer></script>
        <script src="capitulos/capitulo-06.js" defer></script>
        <script src="capitulos/capitulo-07.js" defer></script>
        <script src="capitulos/capitulo-08.js" defer></script>
        <script src="capitulos/capitulo-09.js" defer></script>
        <script src="capitulos/capitulo-10.js" defer></script>
        <script src="capitulos/capitulo-11.js" defer></script>
        <script src="capitulos/capitulo-12.js" defer></script>
        <script src="capitulos/capitulo-13.js" defer></script>
        <script src="capitulos/capitulo-14.js" defer></script>
        <script src="capitulos/capitulo-15.js" defer></script>
        <script src="capitulos/capitulo-16.js" defer></script>
        <script src="capitulos/capitulo-17.js" defer></script>
        <script src="app.js" defer></script>
    </head>
    <body>
        <div class="shell">
            <aside class="sidebar" id="sidebar">
                <div class="brand">
                    <span class="sigil">✦</span>
                    <div>
                        <small>GUÍA DEL DUNGEON MASTER</small>
                        <h1>Out of the Abyss</h1>
                    </div>
                </div>
                <label for="chapter-select">CAPÍTULO ACTIVO</label
                ><select id="chapter-select"></select>
                <p class="hint">Guía extensible por capítulos.</p>
                <hr />
                <p class="nav-title">ÍNDICE DEL CAPÍTULO</p>
                <nav id="section-nav"></nav>
                <div class="side-bottom">
                    <button id="progress">Mostrar progreso</button><small>Herramienta de mesa · Uso del DM</small>
                </div>
            </aside>
            <main>
                <header class="topbar">
                    <button id="menu" class="menu" aria-label="Abrir navegación">☰</button>
                    <div class="crumb">OUT OF THE ABYSS <span>/</span> <b id="chapter-number">CAPÍTULO 1</b></div>
                    <div class="actions">
                        <input
                            id="search"
                            type="search"
                            placeholder="Buscar en la guía…"
                            aria-label="Buscar en la guía"
                        /><button id="print" title="Imprimir">⎙</button>
                    </div>
                </header>
                <section class="hero">
                    <div>
                        <small id="kicker">CAPÍTULO 1 · OUT OF THE ABYSS</small>
                        <h2 id="hero-title">Prisioneros de los drow</h2>
                        <p id="hero-summary"></p>
                        <div id="tags" class="tags"></div>
                    </div>
                    <div class="hero-symbol">✧</div>
                </section>
                <div class="content">
                    <div id="quick" class="quick"></div>
                    <div id="results" hidden></div>
                    <div id="sections"></div>
                    <footer>Hecho para dirigir, no para leer en voz alta. <span id="footer-title"></span></footer>
                </div>
            </main>
        </div>
        <div id="toast" role="status"></div>
    </body>
</html>
